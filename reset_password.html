<!DOCTYPE html>
<html>
    <head>
        <title>Reset Password | SFDAS</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <form class="login-form" action="reset_password.php" method="POST" >
            <div class="form-heading">Set New Password</div>

            <input type="hidden" name="token" id="token" />

            <div class="input-group">
                <label class="label" for="confirm">Confirm Password</label>
                <input required type="password" name="comfirm" id="confirm" placeholder="Confirm new password" />
            </div>

            <button class="submit" type="submit">Reset Password</button>
            <div class="signup-link"><a href="index.html">Back to Login</a></div>

            <script>
                //auto fill token from URL
                const urlParams = new URLSearchParams(window.location.search);
                document.getElementById('token').value = urlParams.get("token");
            
            </script>
        </form>
    </body>
</html>
