<!DOCTYPE html>
<html>
    <head>
        <title>
            SFDAS | LOGIN
        </title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <form lass="login-form" action="login.php" method="POST">
            <div class="form-heading">SFDAS Login</div>
            <div class="input-group">
                <label class="label" for="email">Email</label>
                <input required placeholder="Enter your email" name="email" id="email" type="email" />
            </div>
            <div class="input-group">
                <label class="label" for="password">Password</label>
                <input required placeholder="Enter your password" name="password" id="password" type="password" />
            </div>

            <div class="forgot-password?">
               <a href="#">Forgot Password</a> 
            </div>
            <button class="submit" type="submit">Log in</button>
            <div class="signup-link">Don't have an account? <a href="signup.html">Sign up</a></div>
        </form>
    </body>
</html>
